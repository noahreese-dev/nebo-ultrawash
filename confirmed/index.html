<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Application Received · NEBO 0% Financing</title>
<meta name="theme-color" content="#06208f">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Archivo:ital,wght@0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#0a1530; --cobalt:#0d3fd6; --cobalt-deep:#06208f;
    --cyan:#36ccff; --magenta:#ff2e6e;
  }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  html, body { background: #0a2891; }
  body {
    font-family:'Inter',-apple-system,"Helvetica Neue",Arial,sans-serif;
    color:#fff; -webkit-font-smoothing:antialiased;
    min-height:100vh; overflow-x:hidden;
    background-color: #0a2891;
    /* Deeper cobalt base with a crisp cyan crown at the top and a subtle diagonal sheen.
       Single-falloff radials only, no multi-stop linear, so no banding. */
    background-image:
      linear-gradient(135deg, rgba(54,204,255,0.06) 0%, rgba(54,204,255,0) 38%),
      radial-gradient(ellipse 90% 50% at 50% 0%,
        rgba(54,204,255,0.30) 0%,
        rgba(54,204,255,0) 70%);
    background-repeat: no-repeat;
  }

  /* HOME chip */
  .home {
    position:fixed; top:24px; left:24px; z-index:10;
    display:inline-flex; align-items:center; gap:7px;
    padding:9px 16px; border-radius:99px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.16);
    color:rgba(255,255,255,0.78); font-size:11px; font-weight:700;
    letter-spacing:0.14em; text-transform:uppercase;
    text-decoration:none; backdrop-filter:blur(10px);
    transition:all 0.2s;
  }
  .home:hover { color:#fff; border-color:rgba(255,255,255,0.4); }
  .home svg { width:9px; height:9px; }

  /* THE MOMENT — five elements, generous whitespace */
  .stage {
    min-height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    padding: 96px 32px 80px;
    position:relative;
    gap: 0;
  }

  /* LOGO — clean, no chip, with soft cyan halo */
  .logo {
    width: clamp(170px, 24vw, 240px); height: auto; display:block;
    margin-bottom: 56px;
    filter:
      drop-shadow(0 12px 36px rgba(54,204,255,0.32))
      drop-shadow(0 4px 12px rgba(3,17,76,0.45));
    opacity:0; transform: translateY(8px);
    animation: fadeUp 700ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  /* HEADLINE — single confident line */
  .headline {
    font-family:'Archivo','Inter',sans-serif;
    font-style:italic; font-weight:900;
    font-size: clamp(46px, 8vw, 84px);
    line-height: 0.95; letter-spacing: -1.2px;
    color:#fff; text-transform:uppercase;
    margin: 0;
    opacity:0;
    animation: fadeUp 700ms cubic-bezier(0.22, 1, 0.36, 1) 180ms forwards;
  }

  /* SUBHEAD — the deposit-credit reassurance, one paragraph, breathable */
  .subhead {
    margin-top: 26px;
    font-size: clamp(14.5px, 1.5vw, 16.5px);
    font-weight: 400; line-height: 1.6;
    color: rgba(255,255,255,0.62);
    max-width: 500px;
    opacity:0;
    animation: fadeUp 700ms cubic-bezier(0.22, 1, 0.36, 1) 340ms forwards;
  }
  .subhead .em { color:#fff; font-weight:600; }
  .subhead .credit { color: var(--cyan); font-weight:600; }

  /* REFERENCE — the keepsake. Treated like a quote, not a UI widget. */
  .ref {
    margin-top: 56px;
    display:flex; flex-direction:column; align-items:center;
    gap: 10px;
    opacity:0;
    animation: fadeUp 700ms cubic-bezier(0.22, 1, 0.36, 1) 500ms forwards;
  }
  .ref .lbl {
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.32em; text-transform: uppercase;
    color: rgba(255,255,255,0.4);
  }
  .ref .code {
    position: relative;
    background: transparent; border: none; border-bottom: 1px solid rgba(54,204,255,0.45);
    font-family: 'Archivo', sans-serif; font-style: italic; font-weight: 900;
    font-size: clamp(28px, 4.4vw, 40px);
    letter-spacing: 0.06em; color: #fff;
    padding: 0 0 8px;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .ref .code:focus { outline: none; }
  .ref .code:focus-visible { outline: 2px solid rgba(54,204,255,0.5); outline-offset: 6px; }
  .ref .code:hover { color: var(--cyan); border-color: var(--cyan); }
  .ref .copy-hint {
    font-size: 10.5px; color: rgba(255,255,255,0.35);
    letter-spacing: 0.12em; text-transform: uppercase;
    font-weight: 600;
  }

  /* signature — only if signed, small below ref */
  .sig {
    margin-top: 40px;
    background:#fff; color: var(--ink);
    border-radius: 10px; padding: 12px 16px 9px;
    box-shadow: 0 18px 40px -14px rgba(0,0,0,0.5);
    width: 280px; max-width: 100%;
    opacity:0;
    animation: fadeUp 700ms cubic-bezier(0.22, 1, 0.36, 1) 620ms forwards;
  }
  .sig .cap {
    font-size: 9px; font-weight:800; letter-spacing:0.22em;
    text-transform:uppercase; color:#6b6d83;
    margin-bottom: 4px; text-align:left;
  }
  .sig img {
    display:block; width:100%; height:auto; max-height: 70px;
    border-top: 1px solid #e8e9f0; padding-top: 6px; object-fit:contain;
  }

  /* CTA — single cyan-outlined pill. Clean, no gradient noise. */
  .cta {
    margin-top: 56px;
    display:inline-flex; align-items:center; gap:10px;
    padding: 16px 30px; border-radius: 99px;
    background:rgba(54,204,255,0.10);
    border: 1.5px solid var(--cyan);
    color:#fff; font-weight:800; font-size: 13px;
    letter-spacing: 0.18em; text-transform: uppercase;
    text-decoration: none;
    backdrop-filter: blur(8px);
    opacity:0;
    animation: fadeUp 700ms cubic-bezier(0.22, 1, 0.36, 1) 740ms forwards;
    transition: background 0.2s, transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .cta:hover {
    background: var(--cyan); color: var(--ink);
    transform: translateY(-2px);
  }
  .cta svg { width: 13px; height: 13px; }

  /* email caption — small, calm */
  .email-line {
    margin-top: 28px;
    font-size: 12px; color: rgba(255,255,255,0.4);
    letter-spacing: 0.04em;
    opacity:0;
    animation: fadeUp 600ms cubic-bezier(0.22, 1, 0.36, 1) 880ms forwards;
  }
  .email-line .em { color: rgba(255,255,255,0.75); font-weight: 600; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* COPIED toast */
  .toast {
    position:fixed; left:50%; bottom:48px;
    transform: translateX(-50%) translateY(20px);
    padding: 9px 18px; border-radius: 99px;
    background: rgba(54,204,255,0.94); color: var(--ink);
    font-weight: 800; font-size: 11px;
    letter-spacing: 0.18em; text-transform: uppercase;
    opacity: 0; pointer-events: none; z-index: 20;
    box-shadow: 0 14px 30px -10px rgba(54,204,255,0.55);
    transition: opacity 0.22s, transform 0.22s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* EMPTY STATE */
  .empty {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 80px 28px; gap: 14px;
  }
  .empty h2 {
    font-family:'Archivo'; font-style:italic; font-weight:900;
    font-size: 30px; letter-spacing: -0.4px;
  }
  .empty p { color: rgba(255,255,255,0.55); max-width: 360px; font-size: 14.5px; line-height: 1.55; }
  .empty a {
    margin-top: 14px; display: inline-flex; align-items: center;
    padding: 13px 24px; border-radius: 99px;
    background: var(--cyan); color: var(--ink);
    font-weight: 900; font-size: 12.5px; text-decoration: none;
    letter-spacing: 0.18em; text-transform: uppercase;
  }

  @media (max-width: 520px) {
    .stage { padding: 88px 24px 70px; }
    .logo { margin-bottom: 40px; }
    .ref { margin-top: 44px; }
    .cta { margin-top: 44px; }
  }
</style>
</head>
<body>

  <a href="/" class="home">
    <svg viewBox="0 0 10 10" fill="none">
      <path d="M6.5 1L2.5 5L6.5 9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Home
  </a>

  <div id="root"></div>

  <template id="tpl-card">
    <main class="stage">

      <img class="logo" src="../assets/nebo-logo.png" alt="NEBO UltraWash">

      <h1 class="headline">Application Received.</h1>

      <p class="subhead">
        Your <span class="em" data-fld="depositAmt">deposit</span> is in. At drop-off, we confirm the final price. <span class="credit">Your deposit comes off the total</span>, and you pay the rest in equal monthly payments at 0% interest.
      </p>

      <div class="ref">
        <div class="lbl">Reference</div>
        <button class="code" id="copyBtn" data-fld="referenceCode" type="button" aria-label="Copy reference code">NEBO-XXXXXX</button>
        <div class="copy-hint">Tap to copy</div>
      </div>

      <div class="sig" data-fld="sigBlock">
        <div class="cap">Signed by <span data-fld="sigName">—</span></div>
        <img data-fld="signatureImage" alt="Signature">
      </div>

      <a href="/detailing" class="cta">
        Book your appointment
        <svg viewBox="0 0 14 14" fill="none">
          <path d="M2 7H12M12 7L7.5 2.5M12 7L7.5 11.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <p class="email-line">
        Confirmation sent to <span class="em" data-fld="email">you@email.com</span>
      </p>

    </main>
  </template>

  <template id="tpl-empty">
    <div class="empty">
      <h2>No application found</h2>
      <p>We couldn't find a recent application in this browser. If you just submitted, refresh — otherwise start a new one.</p>
      <a href="/">Start application</a>
    </div>
  </template>

  <div class="toast" id="toast">Copied ✓</div>

<script>
(function(){
  const root = document.getElementById('root');
  let data = {};
  try { data = JSON.parse(sessionStorage.getItem('nebo_confirmation') || '{}'); } catch (e) {}

  if (!data || !data.referenceCode) {
    root.appendChild(document.getElementById('tpl-empty').content.cloneNode(true));
    return;
  }

  const card = document.getElementById('tpl-card').content.cloneNode(true);

  // Buttons aren't queried by tagName==='IMG' so handle text + img separately
  const set = (key, val) => {
    card.querySelectorAll(`[data-fld="${key}"]`).forEach(el => {
      if (el.tagName === 'IMG') el.src = val || '';
      else el.textContent = val;
    });
  };
  const fmt = n => '$' + Math.round(+n || 0).toLocaleString();

  set('referenceCode', data.referenceCode);
  set('email', data.email || '');
  set('depositAmt', data.deposit ? fmt(data.deposit) + ' deposit' : 'deposit');

  const sigBlock = card.querySelector('[data-fld="sigBlock"]');
  if (data.signatureImage) {
    set('signatureImage', data.signatureImage);
    set('sigName', ((data.firstName || '') + ' ' + (data.lastName || '')).trim() || 'You');
  } else {
    sigBlock.remove();
  }

  root.appendChild(card);

  // Copy reference code
  const copyBtn = document.getElementById('copyBtn');
  const toast = document.getElementById('toast');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(data.referenceCode);
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1600);
      } catch (e) {}
    });
  }
})();
</script>
</body>
</html>
